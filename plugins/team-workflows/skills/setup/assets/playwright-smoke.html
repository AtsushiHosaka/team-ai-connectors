<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playwrightの動作確認</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 36rem; margin: 4rem auto; padding: 0 1.5rem; }
  button { font: inherit; padding: .75rem 1.25rem; }
  output { display: block; margin-top: 1.5rem; }
</style>
<h1>Playwrightの動作確認</h1>
<p>ボタンを押すと、下の表示が変わります。このページは外部へ通信しません。</p>
<button type="button" id="check">動作を確認する</button>
<output id="result" aria-live="polite">まだ確認していません</output>
<script>
  document.querySelector('#check').addEventListener('click', () => {
    document.querySelector('#result').textContent = '確認できました';
  });
</script>
</html>
